name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-check:
    name: Native check / macos-15
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          sw_vers
          uname -m
          xcrun swift --version
          xcrun clang --version
      - name: Run complete source check
        run: make check

  apple-silicon-app:
    name: Apple silicon app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and inspect Apple silicon release
        run: make app-release-check
